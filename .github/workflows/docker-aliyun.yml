name: Build and push to Aliyun Container Registry

# 触发条件：推送形如 v1.2.3 的 tag 时触发
# 推送规则：tag vX.Y.Z -> 镜像 tag 同时为 latest 和 vX.Y.Z
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Extract version from tag
        id: version
        run: |
          # tag 形如 v1.2.3，去掉前缀 v 得到 1.2.3
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v2
        with:
          registry: registry.cn-qingdao.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 仅构建 linux/amd64
          # 说明：阿里云容器镜像仓库不支持 OCI 空 manifest 格式（application/vnd.oci.empty.v1+json）。
          # 多架构构建（amd64 + arm64）时 docker buildx 会先推送 OCI empty manifest 作为占位清单，
          # 触发 "denied: unknown manifest class" 错误。如需 arm64，请改用独立的镜像缓存仓库。
          platforms: linux/amd64
          tags: |
            registry.cn-qingdao.aliyuncs.com/fubin/showdoc:latest
            registry.cn-qingdao.aliyuncs.com/fubin/showdoc:${{ steps.version.outputs.VERSION }}
          # 关闭 GHA 缓存：避免 buildx 在多架构/单架构构建中生成 OCI empty manifest，
          # 触发阿里云仓库的格式拒绝问题。如果后续启用缓存，请单独建一个缓存仓库。
